name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check module files
        working-directory: backend
        run: |
          go mod download
          go mod tidy
          git diff --exit-code -- backend/go.mod backend/go.sum
      - name: Check formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Static analysis
        working-directory: backend
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          staticcheck ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend
      - name: Check known vulnerabilities
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Check dead code
        working-directory: backend
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          output="$(deadcode -test ./...)"
          test -z "$output" || { printf '%s\n' "$output"; exit 1; }

  # Go tests run in four shards, each with its own Postgres and Redis.
  # Packages run one at a time, each against its own fresh database;
  # compiling them is done first in parallel. Shard 0 holds
  # the slowest package; every other package is assigned by position, so a
  # new package is always tested without editing this file.
  backend-tests:
    name: Go tests shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: uplumo_test
          POSTGRES_USER: uplumo
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uplumo -d uplumo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://uplumo:ci_test_password@localhost:5432/uplumo_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Pick this shard's packages
        working-directory: backend
        run: |
          slow=github.com/toufiqqureshi/uplumo/backend/internal/emailauth
          if [ "${{ matrix.shard }}" = 0 ]; then
            pkgs="$slow"
          else
            pkgs="$(go list ./... | grep -vx "$slow" | awk -v s="${{ matrix.shard }}" '(NR - 1) % 3 == s - 1')"
          fi
          test -n "$pkgs"
          echo "PKGS=$(echo $pkgs)" >> "$GITHUB_ENV"
          printf '%s\n' $pkgs
      - name: Compile tests in parallel
        working-directory: backend
        # -exec /bin/true builds every test binary and runs none, so no
        # TestMain migrates the shared database in parallel.
        run: go test -race -count=1 -exec /bin/true $PKGS
      - name: Test with race detector and real Postgres and Redis
        working-directory: backend
        # Each package gets a fresh database: some tests create tables
        # outside the migrations, so a shared one depends on package order.
        run: |
          test -n "$TEST_DATABASE_URL"
          base="${TEST_DATABASE_URL%%/uplumo_test*}"
          n=0
          failed=0
          for pkg in $PKGS; do
            n=$((n + 1))
            PGPASSWORD=ci_test_password psql -q -h localhost -U uplumo -d uplumo_test -c "CREATE DATABASE pkg_$n"
            TEST_DATABASE_URL="$base/pkg_$n?sslmode=disable" go test -race -count=1 "$pkg" || failed=1
          done
          exit "$failed"

  frontend:
    name: Frontend checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend quality gates
        run: pnpm ci:check
      - name: Run frontend tests
        run: pnpm test

  # Browser tests that fail if a page load, reload, typing or a double click
  # buys provider work. Provider APIs are mocked: no real paid call is made.
  paid-call-guards:
    name: Paid-call guards (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Videos of failed tests need Playwright's ffmpeg; Chrome is the runner's.
      - name: Install Playwright ffmpeg
        run: pnpm exec playwright install ffmpeg
      - name: Run paid-call browser tests
        run: pnpm test:e2e dashboard-spend content-editor search-growth audit-capabilities theme-preference cite-fix
