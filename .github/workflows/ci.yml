name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check module files
        working-directory: backend
        run: |
          go mod download
          go mod tidy
          git diff --exit-code -- backend/go.mod backend/go.sum
      - name: Check formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Static analysis
        working-directory: backend
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          staticcheck ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend
      - name: Check known vulnerabilities
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Check dead code
        working-directory: backend
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          output="$(deadcode -test ./...)"
          test -z "$output" || { printf '%s\n' "$output"; exit 1; }

  # Go tests run in four shards, each with its own Postgres and Redis.
  # Packages in one shard share a database, so they still run one at a
  # time (-p 1); compiling them is done first in parallel. Shard 0 holds
  # the slowest package; every other package is assigned by position, so a
  # new package is always tested without editing this file.
  backend-tests:
    name: Go tests shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: uplumo_test
          POSTGRES_USER: uplumo
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uplumo -d uplumo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://uplumo:ci_test_password@localhost:5432/uplumo_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Pick this shard's packages
        working-directory: backend
        run: |
          slow=github.com/toufiqqureshi/uplumo/backend/internal/emailauth
          if [ "${{ matrix.shard }}" = 0 ]; then
            pkgs="$slow"
          else
            pkgs="$(go list ./... | grep -vx "$slow" | awk -v s="${{ matrix.shard }}" '(NR - 1) % 3 == s - 1')"
          fi
          test -n "$pkgs"
          echo "PKGS=$(echo $pkgs)" >> "$GITHUB_ENV"
          printf '%s\n' $pkgs
      - name: Compile tests in parallel
        working-directory: backend
        run: go test -race -count=1 -run '^$' $PKGS
      - name: Test with race detector and real Postgres and Redis
        working-directory: backend
        run: |
          test -n "$TEST_DATABASE_URL"
          go test -p 1 -race -count=1 $PKGS

  frontend:
    name: Frontend checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend quality gates
        run: pnpm ci:check
      - name: Run frontend tests
        run: pnpm test
