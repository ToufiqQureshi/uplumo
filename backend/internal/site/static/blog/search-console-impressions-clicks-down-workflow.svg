<text x="60" y="66" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#7ee1c1">UPLUMO / PRACTICAL GUIDE</text>
<text x="60" y="122" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Break a click decline into its parts</text>
<rect x="60" y="225" width="1080" height="131" rx="16" fill="#1c2c46"/>
<circle cx="104" cy="267" r="23" fill="#7ee1c1"/>
<text x="104" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#101a2e">1</text>
<text x="150" y="269" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Query mix</text>
<text x="150" y="308" font-family="Arial,sans-serif" font-size="24" fill="#d5e0f1">New broad queries can lower average CTR.</text>
