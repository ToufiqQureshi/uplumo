<circle cx="104" cy="420" r="23" fill="#7ee1c1"/>
<text x="104" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#101a2e">2</text>
<text x="150" y="422" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Position and layout</text>
<text x="150" y="461" font-family="Arial,sans-serif" font-size="24" fill="#d5e0f1">Different visibility changes click opportunity.</text>
<rect x="60" y="531" width="1080" height="131" rx="16" fill="#1c2c46"/>
<circle cx="104" cy="573" r="23" fill="#7ee1c1"/>
<text x="104" y="581" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#101a2e">3</text>
<text x="150" y="575" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Snippet and intent</text>
<text x="150" y="614" font-family="Arial,sans-serif" font-size="24" fill="#d5e0f1">The result must match the page and searcher.</text>
