<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Break a click decline into its parts</title>
<desc id="desc">Query mix: New broad queries can lower average CTR.; Position and layout: Different visibility changes click opportunity.; Snippet and intent: The result must match the page and searcher.</desc>
