<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Choose the correct indexing repair</title>
<desc id="desc">Not discovered: Add useful crawl paths and a clean sitemap.; Blocked or failing: Inspect access, status and indexing rules.; Indexed but invisible: Review query fit and competitive relevance.</desc>
<rect width="1200" height="800" rx="24" fill="#101a2e"/>
<text x="60" y="66" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#7ee1c1">UPLUMO / PRACTICAL GUIDE</text>
<text x="60" y="122" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Choose the correct indexing repair</text>
<rect x="60" y="225" width="1080" height="131" rx="16" fill="#1c2c46"/>
<circle cx="104" cy="267" r="23" fill="#7ee1c1"/>
<text x="104" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#101a2e">1</text>
<text x="150" y="269" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Not discovered</text>
<text x="150" y="308" font-family="Arial,sans-serif" font-size="24" fill="#d5e0f1">Add useful crawl paths and a clean sitemap.</text>
<rect x="60" y="378" width="1080" height="131" rx="16" fill="#1c2c46"/>
<circle cx="104" cy="420" r="23" fill="#7ee1c1"/>
<text x="104" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#101a2e">2</text>
<text x="150" y="422" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Blocked or failing</text>
<text x="150" y="461" font-family="Arial,sans-serif" font-size="24" fill="#d5e0f1">Inspect access, status and indexing rules.</text>
<rect x="60" y="531" width="1080" height="131" rx="16" fill="#1c2c46"/>
<circle cx="104" cy="573" r="23" fill="#7ee1c1"/>
<text x="104" y="581" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#101a2e">3</text>
<text x="150" y="575" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Indexed but invisible</text>
<text x="150" y="614" font-family="Arial,sans-serif" font-size="24" fill="#d5e0f1">Review query fit and competitive relevance.</text>
<text x="60" y="760" font-family="Arial,sans-serif" font-size="19" fill="#adbed5">Explanatory diagram • Read the guide for conditions and limitations</text></svg>
