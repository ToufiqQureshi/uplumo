<title id="title">Reconcile clicks and sessions sensibly</title>
<desc id="desc">Match scope: Property, URL, dates, country and device.; Check collection: Consent, blocked tags and redirects affect visits.; Explain gaps: A search click is not the same unit as a session.</desc>
