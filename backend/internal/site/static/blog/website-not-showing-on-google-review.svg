<text x="150" y="269" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Public useful page</text>
<text x="150" y="308" font-family="Arial,sans-serif" font-size="24" fill="#d5e0f1">Fix access and request a recrawl.</text>
