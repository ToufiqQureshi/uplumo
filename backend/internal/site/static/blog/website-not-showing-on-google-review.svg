<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Distinguish a removal from a discovery request</title>
<desc id="desc">Public useful page: Fix access and request a recrawl.; Retired resource: Use a relevant replacement or proper 404/410.; Private resource: Require access control; remove public exposure.</desc>
