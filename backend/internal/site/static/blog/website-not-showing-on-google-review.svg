<text x="150" y="422" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Retired resource</text>
<text x="150" y="461" font-family="Arial,sans-serif" font-size="24" fill="#d5e0f1">Use a relevant replacement or proper 404/410.</text>
<rect x="60" y="531" width="1080" height="131" rx="16" fill="#1c2c46"/>
<circle cx="104" cy="573" r="23" fill="#7ee1c1"/>
