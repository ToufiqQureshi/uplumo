openapi: 3.1.0
info:
  title: Uplumo GA4 reports
  version: 1.0.0
paths:
  /api/v1/projects/{projectId}/ga4/connection/status:
    post:
      operationId: ga4ConnectionStatus
      summary: Get the selected property and current user's grant/permission state
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, maxProperties: 0, additionalProperties: false }
      responses:
        "200": { description: Connection and setup status }
        "401": { description: Authentication required }
        "404": { description: Project not found }
        "503": { description: GA4 setup repository is not available }
  /api/v1/projects/{projectId}/ga4/properties/list:
    post:
      operationId: ga4ListProperties
      summary: List GA4 properties visible to the signed-in user's Google grants
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, maxProperties: 0, additionalProperties: false }
      responses:
        "200": { description: Per-account properties and reconnect/unavailable status }
        "401": { description: Authentication required }
        "502": { description: Google provider unavailable }
        "503": { description: GA4 setup is not configured }
  /api/v1/projects/{projectId}/ga4/connection/set:
    post:
      operationId: ga4SetProperty
      summary: Verify and select a GA4 property for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, propertyId]
              properties:
                accountId: { type: string, minLength: 1, maxLength: 256 }
                propertyId: { type: string, pattern: '^properties/[0-9]+$' }
      responses:
        "200": { description: Selected property metadata }
        "400": { description: Invalid property selection }
        "403": { description: Integration management permission required }
        "404": { description: Google grant or property is not available to the user }
        "502": { description: Google provider unavailable }
  /api/v1/projects/{projectId}/ga4/connection/disconnect:
    post:
      operationId: ga4DisconnectProperty
      summary: Remove the selected GA4 property from a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, maxProperties: 0, additionalProperties: false }
      responses:
        "200": { description: Connection removed }
        "403": { description: Integration management permission required }
        "503": { description: GA4 setup repository is not available }
  /api/v1/projects/{projectId}/ga4/search-opportunities:
    post:
      operationId: ga4SearchOpportunities
      summary: Join organic landing pages with Search Console rankings
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { description: Joined and scored page opportunities }
        "400": { description: Invalid dates or limit }
        "401": { description: Authentication required }
        "404": { description: GA4 property or GSC site is not connected }
        "429": { description: Search Console rate limited the request }
        "502": { description: Google Analytics or Search Console provider error }
        "503": { description: A required integration is not configured }
  /api/v1/projects/{projectId}/ga4/measurement-health:
    post:
      operationId: ga4MeasurementHealth
      summary: Inspect data streams, enhanced measurement and custom definitions
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, maxProperties: 0, additionalProperties: false }
      responses:
        "200": { description: Measurement health information }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "404": { description: No property is connected }
        "502": { description: Google Analytics Admin API error }
        "503": { description: GA4 is not configured }
  /api/v1/projects/{projectId}/ga4/overview/organic:
    post:
      operationId: ga4OrganicOverview
      summary: Get organic search totals, previous-period comparison and trend
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                trend: { type: string, enum: [daily, weekly], default: daily }
      responses:
        "200": { description: Organic summary, comparison and trend data }
        "400": { description: Invalid date range or trend }
        "401": { description: Authentication required }
        "404": { description: No property is connected }
        "502": { description: Google Analytics provider error }
        "503": { description: GA4 is not configured }
  /api/v1/projects/{projectId}/ga4/reports/run:
    post:
      operationId: ga4RunReport
      summary: Run a GA4 report for the connected property
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: GA4 report, preserving the legacy JSON response shape
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid report request
        '401':
          description: Session is missing or invalid
        '404':
          description: Project or GA4 connection was not found
        '502':
          description: Google Analytics rejected the report or is unavailable
        '503':
          description: GA4 reporting is not configured
  /api/v1/projects/{projectId}/ga4/growth/report:
    post:
      operationId: ga4GrowthReport
      summary: Analyze GSC and Google-organic GA4 evidence without paid providers
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrowthRequest' }
      responses:
        "200": { description: Scoped evidence or action result; missing metrics remain null. Comparisons may be waiting for complete data. }
        "400": { description: Invalid or expired report input }
        "401": { description: Authentication required }
        "404": { description: Project, connection or action not found }
        "502": { description: Google report unavailable }
  /api/v1/projects/{projectId}/ga4/growth/devices:
    post:
      operationId: ga4GrowthDevices
      summary: Read Google-organic device performance
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrowthRequest' }
      responses:
        "200": { description: Scoped evidence or action result; missing metrics remain null. Comparisons may be waiting for complete data. }
        "400": { description: Invalid or expired report input }
        "401": { description: Authentication required }
        "404": { description: Project, connection or action not found }
        "502": { description: Google report unavailable }
  /api/v1/projects/{projectId}/ga4/growth/list:
    post:
      operationId: ga4GrowthList
      summary: List saved page actions and baselines
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        "200": { description: Scoped evidence or action result; missing metrics remain null. Comparisons may be waiting for complete data. }
        "400": { description: Invalid or expired report input }
        "401": { description: Authentication required }
        "404": { description: Project, connection or action not found }
        "502": { description: Google report unavailable }
  /api/v1/projects/{projectId}/ga4/growth/save:
    post:
      operationId: ga4GrowthSave
      summary: Save an idempotent page action from a server report
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reportId, page, note], properties: { reportId: { type: string }, page: { type: string, maxLength: 2048 }, note: { type: string, minLength: 1, maxLength: 1000 }, controlPage: { type: string, maxLength: 2048, description: Optional unchanged page from this server report } } }
      responses:
        "200": { description: Scoped evidence or action result; missing metrics remain null. Comparisons may be waiting for complete data. }
        "400": { description: Invalid or expired report input }
        "401": { description: Authentication required }
        "404": { description: Project, connection or action not found }
        "502": { description: Google report unavailable }
  /api/v1/projects/{projectId}/ga4/growth/update:
    post:
      operationId: ga4GrowthUpdate
      summary: Update a page action status while preserving its first applied date
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [id, status], properties: { id: { type: string }, status: { type: string, enum: [planned, applied, dismissed] } } }
      responses:
        "200": { description: Scoped evidence or action result; missing metrics remain null. Comparisons may be waiting for complete data. }
        "400": { description: Invalid or expired report input }
        "401": { description: Authentication required }
        "404": { description: Project, connection or action not found }
        "502": { description: Google report unavailable }
  /api/v1/projects/{projectId}/ga4/growth/delete:
    post:
      operationId: ga4GrowthDelete
      summary: Remove a saved page action
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [id], properties: { id: { type: string } } }
      responses:
        "200": { description: Scoped evidence or action result; missing metrics remain null. Comparisons may be waiting for complete data. }
        "400": { description: Invalid or expired report input }
        "401": { description: Authentication required }
        "404": { description: Project, connection or action not found }
        "502": { description: Google report unavailable }
  /api/v1/projects/{projectId}/ga4/growth/compare:
    post:
      operationId: ga4GrowthCompare
      summary: Compare an applied change with complete post-change evidence
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [id, days], properties: { id: { type: string }, days: { type: integer, enum: [14, 28] } } }
      responses:
        "200": { description: Scoped evidence or action result; missing metrics remain null. Comparisons may be waiting for complete data. }
        "400": { description: Invalid or expired report input }
        "401": { description: Authentication required }
        "404": { description: Project, connection or action not found }
        "502": { description: Google report unavailable }
  /api/v1/projects/{projectId}/ga4/growth/goals:
    post:
      operationId: ga4GrowthGoals
      summary: Discover registered outcome-specific rates
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { description: Scoped evidence or monitoring state with source limitations. No paid provider is called. }
        "400": { description: Invalid or unsupported inputs or expired server report }
        "401": { description: Authentication required }
        "404": { description: Project or connection unavailable }
        "502": { description: Google reporting unavailable }
  /api/v1/projects/{projectId}/ga4/growth/tracking:
    post:
      operationId: ga4GrowthTracking
      summary: Inspect observed attribution evidence and measurement checklist
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrowthRequest' }
      responses:
        "200": { description: Scoped evidence or monitoring state with source limitations. No paid provider is called. }
        "400": { description: Invalid or unsupported inputs or expired server report }
        "401": { description: Authentication required }
        "404": { description: Project or connection unavailable }
        "502": { description: Google reporting unavailable }
  /api/v1/projects/{projectId}/ga4/growth/funnel:
    post:
      operationId: ga4GrowthFunnel
      summary: Read an ordered user funnel from tracked GA4 events
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [startDate, endDate, steps], properties: { startDate: { type: string, format: date }, endDate: { type: string, format: date }, steps: { type: array, minItems: 2, maxItems: 5, uniqueItems: true, items: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,39}$' } }, byDevice: { type: boolean } } }
      responses:
        "200": { description: Scoped evidence or monitoring state with source limitations. No paid provider is called. }
        "400": { description: Invalid or unsupported inputs or expired server report }
        "401": { description: Authentication required }
        "404": { description: Project or connection unavailable }
        "502": { description: Google reporting unavailable }
  /api/v1/projects/{projectId}/ga4/growth/clicks:
    post:
      operationId: ga4GrowthClicks
      summary: Investigate low or falling clicks for a trusted report page
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reportId, page], properties: { reportId: { type: string }, page: { type: string } } }
      responses:
        "200": { description: Scoped evidence or monitoring state with source limitations. No paid provider is called. }
        "400": { description: Invalid or unsupported inputs or expired server report }
        "401": { description: Authentication required }
        "404": { description: Project or connection unavailable }
        "502": { description: Google reporting unavailable }
  /api/v1/projects/{projectId}/ga4/growth/monitor:
    post:
      operationId: ga4GrowthMonitor
      summary: Read weekly in-app monitoring state
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { description: Scoped evidence or monitoring state with source limitations. No paid provider is called. }
        "400": { description: Invalid or unsupported inputs or expired server report }
        "401": { description: Authentication required }
        "404": { description: Project or connection unavailable }
        "502": { description: Google reporting unavailable }
  /api/v1/projects/{projectId}/ga4/growth/monitor-save:
    post:
      operationId: ga4GrowthMonitorSave
      summary: Explicitly enable or disable weekly in-app Google-data checks
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [enabled], properties: { enabled: { type: boolean }, goalEvent: { type: string, maxLength: 40 } } }
      responses:
        "200": { description: Scoped evidence or monitoring state with source limitations. No paid provider is called. }
        "400": { description: Invalid or unsupported inputs or expired server report }
        "401": { description: Authentication required }
        "404": { description: Project or connection unavailable }
        "502": { description: Google reporting unavailable }
components:
  schemas:
    GrowthRequest:
      type: object
      additionalProperties: false
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        brandTerms: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 100 } }
        goalEvent: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,39}$', description: Registered successful outcome; raw keyEvents remains all events. }
        comparison: { type: string, enum: [previous, year], description: year shifts both endpoints 364 days to preserve weekdays. }
        expanded: { type: boolean, default: false, description: Explicitly page up to 5000 rows per source instead of 1000. }
    ReportRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [landing_pages, page_performance, key_events, traffic_acquisition, ecommerce_performance, site_search, audience_breakdown]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        limit:
          type: integer
          minimum: 1
          maximum: 1000
        offset:
          type: integer
          minimum: 0
        channel:
          type: string
          enum: [organic_search, all]
          default: organic_search
        includeDate:
          type: boolean
        breakdown:
          type: string
          enum: [event, event_and_landing_page]
        acquisitionBreakdown:
          type: string
          enum: [channel_group, source_medium, campaign]
        ecommerceBreakdown:
          type: string
          enum: [item, landing_page]
        ecommerceOnlyWithTransactions:
          type: boolean
        audienceBreakdown:
          type: string
          enum: [device, country, new_vs_returning]
        comparePreviousPeriod:
          type: boolean
