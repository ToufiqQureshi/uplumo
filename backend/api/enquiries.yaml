openapi: 3.1.0
info:
  title: Uplumo enquiry evidence
  version: 1.0.0
  description: Free first-party event reporting. Every route requires session and project membership. No paid provider or customer-site request is made.
servers:
  - url: /api/v1
paths:
  /projects/{projectId}/analytics/enquiries:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: getEnquiryEvidence
      responses:
        '200':
          description: eventName, siteConfigured, goalObserved (28 complete days), beforeStart/currentStart/until, up to 50 page metrics/signals and 20 saved changes. Counts are matched daily anonymous visitor IDs, not people or confirmed leads. Drop thresholds are documented in internal/analytics/README.md.
  /projects/{projectId}/analytics/enquiries/goal:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: saveEnquiryGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventName]
              properties:
                eventName: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200': { description: Goal saved; existing baselines are unchanged }
        '400': { description: Invalid event name }
  /projects/{projectId}/analytics/enquiries/changes:
    parameters:
      - $ref: '#/components/parameters/Project'
      - in: header
        name: Idempotency-Key
        required: true
        schema: { type: string, minLength: 8, maxLength: 128 }
    post:
      operationId: saveEnquiryBaseline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, note]
              properties:
                path: { type: string, maxLength: 2048, description: Page path only; no origin, query or fragment }
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: id of immutable last-complete-week baseline; repeated request key reuses the id }
        '400': { description: Missing goal or invalid input }
        '409': { description: Project already has 100 baselines }
  /projects/{projectId}/analytics/enquiries/changes/{changeId}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Change'
    get:
      operationId: compareEnquiryBaseline
      responses:
        '200': { description: change, after, afterStart, afterEnd, ready. After is only measured once seven complete UTC days after the change date have elapsed. It describes association, not causal uplift. }
        '404': { description: Missing or foreign baseline }
  /projects/{projectId}/analytics/enquiries/changes/{changeId}/delete:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Change'
    post:
      operationId: deleteEnquiryBaseline
      responses:
        '200': { description: Baseline deleted from this project only; missing or foreign baseline is a no-op }
components:
  parameters:
    Project:
      in: path
      name: projectId
      required: true
      schema: { type: string }
    Change:
      in: path
      name: changeId
      required: true
      schema: { type: string }
