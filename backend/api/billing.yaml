openapi: 3.1.0
info:
  title: Uplumo billing usage
  version: 1.0.0
  description: |
    A workspace's credits. Every paid data lookup (DataForSEO) and AI call
    spends credits at provider cost times the markup; each paid month of a
    plan grants that plan's monthly credits. Only the usage summary is
    described here; plan, checkout and webhook routes are in
    `internal/billing/README.md`.

    Any route that makes a paid lookup can answer with the refusals
    below. Nothing is sent to the provider when they are returned.
servers:
  - url: /api/v1
paths:
  /billing/usage:
    get:
      operationId: getBillingUsage
      summary: Credits left, this month's spend by feature, and typical costs
      responses:
        "200":
          description: The active workspace's credit summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NoOrganization"
        "503":
          description: Billing is not set up on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /billing/topups:
    get:
      operationId: listCreditPacks
      responses:
        "200": { description: Configured credit packs; empty when sales or payments are disabled }
  /billing/topups/checkout:
    post:
      operationId: checkoutCreditPack
      description: Workspace owner/admin with an active paid plan. Browser amounts are never accepted. Reuses the workspace's pending pack order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packId]
              properties:
                packId: { type: string }
      responses:
        "200": { description: Server-priced order (id, orderId, keyId, amount in paise, currency, credits, expiresAfterDays, status) }
        "400": { description: Pack unavailable }
        "402": { description: Active paid plan required }
        "403": { description: Workspace owner/admin required }
        "409": { description: Existing pending checkout }
        "503": { description: Payments unavailable }
  /billing/topups/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getCreditPackPayment
      responses:
        "200": { description: Workspace-scoped order status; only signed payment.captured webhooks grant credits }
        "404": { description: Missing or foreign order }
components:
  schemas:
    Feature:
      type: string
      enum: [rank_tracking, keyword_research, domain_research, backlinks, ai_visibility, site_audit, ai_assistant, ai_writing]
    Usage:
      type: object
      required: [plan, unlimited, chargesCredits, balanceCredits, monthlyCredits, periodStart, periodEnd, spent, costs]
      properties:
        plan:
          type: string
          enum: [free, basic, pro, business, agency]
        unlimited:
          type: boolean
          description: An Uplumo staff workspace, topped up instead of refused.
        chargesCredits:
          type: boolean
          description: False on a server without payments; nothing is charged.
        balanceCredits:
          type: integer
          minimum: 0
        scheduledCredits:
          type: integer
          minimum: 0
          description: Saved rank and AI check ceilings due before forecastUntil; excludes ad-hoc usage and provider retries.
        remainingAfterSchedules:
          type: integer
          description: Current balance minus scheduledCredits; may be negative, excludes future grant expiry and new usage.
        forecastUntil:
          type: string
          format: date-time
        monthlyCredits:
          type: integer
          minimum: 0
          description: What one paid month of the plan grants.
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: [string, "null"]
          format: date-time
        spent:
          type: array
          description: Credits charged since periodStart, largest first. "other" holds charges made before spend was labelled.
          items:
            type: object
            required: [feature, credits]
            properties:
              feature:
                oneOf:
                  - $ref: "#/components/schemas/Feature"
                  - const: other
              credits:
                type: integer
                minimum: 1
        costs:
          type: array
          description: About what one action of each feature costs. The real cost is charged per request.
          items:
            type: object
            required: [feature, unit, credits]
            properties:
              feature:
                $ref: "#/components/schemas/Feature"
              unit:
                type: string
              credits:
                type: integer
                minimum: 1
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    Unauthorized:
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoOrganization:
      description: No active workspace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InsufficientCredits:
      description: "`insufficient_credits`: the workspace has not got the credits the lookup needs."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DailyCreditLimit:
      description: "429 `daily_credit_limit`: this workspace used a third of its monthly credits today. Other workspaces are not affected."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PlanLimitsExceeded:
      description: "402 `plan_limits_exceeded`: retained workspace data exceeds the active plan after a downgrade; data is preserved and paid calls are paused."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UsagePaused:
      description: "503 `usage_paused`: today's provider spend for all workspaces reached PROVIDER_DAILY_LIMIT_USD (an emergency stop)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
